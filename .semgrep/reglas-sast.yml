# Reglas SAST - OWASP WebGoat fork
#
# Se ejecutan en el job "sast" junto con los rulesets publicos p/java y
# p/owasp-top-ten. Severidad ERROR = bloquea el pipeline; WARNING = solo avisa.
rules:
  - id: webgoat-sqli-concatenacion-statement
    languages: [java]
    severity: ERROR
    message: >-
      Consulta SQL construida concatenando datos y ejecutada con java.sql.Statement.
      Un atacante puede alterar la consulta (SQL Injection). Use PreparedStatement
      con parametros (?) en lugar de concatenar strings.
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      asvs: "V5.3.4"
      category: security
    patterns:
      - pattern-either:
          - pattern: (java.sql.Statement $S).$EXEC("..." + $X + ...)
          - pattern: |
              $Q = "..." + $X + ...;
              ...
              (java.sql.Statement $S).$EXEC($Q);
          - pattern: |
              String $Q = "..." + $X + ...;
              ...
              (java.sql.Statement $S).$EXEC($Q);
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(execute|executeQuery|executeUpdate|executeLargeUpdate|addBatch)$

  - id: webgoat-hash-debil-md5-sha1
    languages: [java]
    severity: WARNING
    message: >-
      Uso de algoritmo de hash debil ($ALG). MD5 y SHA-1 son vulnerables a colisiones
      y no deben usarse para proteger contrasenas ni firmar datos. Use SHA-256 o
      superior, y para contrasenas bcrypt/Argon2.
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      asvs: "V6.2.5"
      category: security
    patterns:
      - pattern: java.security.MessageDigest.getInstance($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^"(MD5|MD2|SHA-?1)"$

  - id: webgoat-credencial-hardcodeada
    languages: [java]
    severity: WARNING
    message: >-
      Posible credencial o secreto escrito directamente en el codigo ($NAME).
      Los secretos deben venir de variables de entorno o de un gestor de secretos.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      asvs: "V2.10.4"
      category: security
    patterns:
      - pattern-either:
          - pattern: String $NAME = "$VALUE";
          - pattern: $T $NAME = "$VALUE";
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|passwd|pwd|secret|apikey|api_key|token).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: .{4,}
